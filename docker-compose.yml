services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: legal_rag
      POSTGRES_DB: legal_rag
    ports:
      - "5432:5432"
    volumes:
      - legal_rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  legal_rag_postgres_data:
